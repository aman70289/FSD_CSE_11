<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Table</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        h1 {
            margin-bottom: 25px;
            color: #222;
        }
        table {
            border-collapse: collapse;
            min-width: 900px;
            background-color: white;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th,
        td {
            border: 1px solid #ddd;
            padding: 12px 20px;
        }
        th {
            background-color: #222;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        /* Add to Cart Button */
        .cart-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            background-color: #ff9800;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-btn:hover {
            background-color: #e68900;
        }

        /* Place Order Button */
        .order-btn {
            margin-top: 25px;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .order-btn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
    </style>

    <script>

        const url = "https://dummyjson.com/products";

        async function loadProduct() {

            try {

                const res = await fetch(url);

                const data = await res.json();

                createTable(data.products);

            } catch (error) {

                console.log(error);

            }
        }


        function createTable(products) {

            const table = document.querySelector("table");

            table.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Rating</th>
                    <th>Add to Cart</th>
                </tr>
            `;


            products.forEach((product) => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${product.id}</td>

                    <td>${product.title}</td>

                    <td>$${product.price}</td>

                    <td>${product.category}</td>

                    <td>⭐ ${product.rating}</td>

                    <td>
                        <button class="cart-btn">
                            Add to Cart
                        </button>
                    </td>
                `;

                table.appendChild(row);

            });
        }


        function placeOrder() {

            alert("Order placed successfully! 🎉");

        }


        loadProduct();

    </script>

</head>


<body>+

    <h1>🛒 Product Table</h1>

    <table></table>

    <button class="order-btn" onclick="placeOrder()">
        Place Order
    </button>

</body>

</html>
